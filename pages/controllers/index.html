<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10th GAMES — الكنترولرات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/animations.css">
  <link rel="stylesheet" href="./controllers.css">
</head>
<body>
  <div id="sidebarContainer"></div>
  <div class="main-wrapper">
    <div id="topbarContainer"></div>
    <main class="page-section page-fade">
      <div class="page-header">
        <div class="page-title">
          <span class="page-title-icon">🎮</span>
          <div>
            <h1>إدارة الكنترولرات ودراعات التحكم</h1>
            <p id="ctrlSummaryText" style="margin:0;font-size:0.82rem;color:var(--text-muted);">جاري التحميل...</p>
          </div>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddControllerModal()">➕ كنترولر جديد</button>
        </div>
      </div>

      <!-- Filters Bar -->
      <div class="filters-bar">
        <div class="search-field">
          <input type="text" id="ctrlSearchInput" placeholder="🔍 بحث برقم الكنترولر أو النوع..." oninput="renderControllers()">
        </div>
        <select id="ctrlStatusFilter" class="filter-select" onchange="renderControllers()">
          <option value="">كل الحالات</option>
          <option value="available">متاح</option>
          <option value="in_use">قيد الاستخدام</option>
          <option value="charging">شحن 🔋</option>
          <option value="maintenance">صيانة 🛠️</option>
        </select>
      </div>

      <!-- Controllers Grid -->
      <div class="controllers-grid" id="controllersGrid">
        <!-- Filled by JS -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Controller Modal -->
  <div class="modal-overlay hidden" id="controllerModalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="ctrlModalTitle">➕ إضافة كنترولر</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ctrlEditId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">رقم/معرف الكنترولر <span class="form-required">*</span></label>
            <input type="text" id="ctrlNumber" placeholder="مثال: CTRL-01">
          </div>
          <div class="form-group">
            <label class="form-label">النوع</label>
            <select id="ctrlType">
              <option value="DualSense">DualSense (PS5)</option>
              <option value="DualShock 4">DualShock 4 (PS4)</option>
              <option value="Xbox Wireless">Xbox Wireless</option>
              <option value="PC Gamepad">PC Gamepad</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">الحالة</label>
            <select id="ctrlStatus">
              <option value="available">✅ متاح</option>
              <option value="in_use">🎮 قيد الاستخدام</option>
              <option value="charging">⚡ قيد الشحن</option>
              <option value="maintenance">🛠️ تحت الصيانة</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">نسبة البطارية (%)</label>
            <input type="number" id="ctrlBattery" min="0" max="100" value="100">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">الجهاز المرتبط به</label>
          <select id="ctrlDeviceSelect">
            <option value="">غير مرتبط بجهاز</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveController()">💾 حفظ</button>
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>window.BASE_PATH='../../';</script>
  <script>window.PAGE_KEY='controllers';</script>
  <script>window.PAGE_TITLE='الكنترولرات';</script>
  <script>window.PAGE_ICON='🎮';</script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="./controllers.js"></script>
</body>
</html>
