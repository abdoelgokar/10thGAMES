<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10th GAMES — الموظفون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/animations.css">
</head>
<body>
  <div id="sidebarContainer"></div>
  <div class="main-wrapper">
    <div id="topbarContainer"></div>
    <main class="page-section page-fade">
      <div class="page-header">
        <div class="page-title">
          <span class="page-title-icon">👤</span>
          <div>
            <h1>إدارة الموظفين والصلاحيات</h1>
            <p style="margin:0;font-size:0.82rem;color:var(--text-muted);">إضافة موظفين، تحديد الأدوار والصلاحيات</p>
          </div>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddEmpModal()">➕ موظف جديد</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>اسم المستخدم</th>
              <th>الدور</th>
              <th>تاريخ الانضمام</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="empTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Employee Modal -->
  <div class="modal-overlay hidden" id="empModalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="empModalTitle">➕ إضافة موظف</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="empEditId">
        <div class="form-group">
          <label class="form-label">الاسم بالكامل <span class="form-required">*</span></label>
          <input type="text" id="empName" placeholder="اسم الموظف">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">اسم المستخدم <span class="form-required">*</span></label>
            <input type="text" id="empUsername" placeholder="username">
          </div>
          <div class="form-group">
            <label class="form-label">كلمة المرور <span class="form-required" id="empPassReq">*</span></label>
            <input type="password" id="empPassword" placeholder="••••••••">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">الدور والترخيص</label>
          <select id="empRole">
            <option value="cashier">كاشير (صلاحيات أساسية)</option>
            <option value="manager">مشرف (إدارة المنتجات والأجهزة والتقارير)</option>
            <option value="admin">مدير النظام (صلاحيات كاملة)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveEmployee()">💾 حفظ الموظف</button>
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>window.BASE_PATH='../../';</script>
  <script>window.PAGE_KEY='employees';</script>
  <script>window.PAGE_TITLE='الموظفون';</script>
  <script>window.PAGE_ICON='👤';</script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="./employees.js"></script>
</body>
</html>
